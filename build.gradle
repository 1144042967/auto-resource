plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

repositories {
	// Loom 已自动添加获取 Minecraft 与基础库所需仓库（镜像见 settings.gradle），仅当需要其他第三方 MOD 构件时才在此添加。
}

// Create 兼容层（可选依赖）：libs/ 下提供 create-fabric jar 与预先合并的 porting-lib 单 jar 时才参与编译。
// MC 26.1.2(=1.21.5)对应 Create Fabric 6.0.x 系列、porting-lib 4.x；libs/ 下文件名匹配 "create*" 与 "porting*"。
def createJars = fileTree(dir: 'libs', include: 'create*.jar')
def portingJars = fileTree(dir: 'libs', include: 'porting*.jar')
def hasCreate = !createJars.empty && !portingJars.empty

loom {
	splitEnvironmentSourceSets()

	mods {
		"autoresource" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

sourceSets {
	main {
		java {
			if (!hasCreate) {
				exclude 'cn/sd/jrz/autoresource/compat/create/CreateRegistration.java'
				exclude 'cn/sd/jrz/autoresource/compat/create/WaterWheelMotorBlock.java'
				exclude 'cn/sd/jrz/autoresource/compat/create/WaterWheelMotorEntity.java'
				exclude 'cn/sd/jrz/autoresource/compat/create/WaterWheelMotorItem.java'
				exclude 'cn/sd/jrz/autoresource/compat/create/WaterWheelMotorMenu.java'
			}
		}
	}
	client {
		java {
			if (!hasCreate) {
				exclude 'cn/sd/jrz/autoresource/client/compat/create/**'
			}
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// 26.x 系列直接以官方 deobfuscated 名称发布，不再需要显式 mapping（loom 默认启用 official_mojang_mappings）
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// TechReborn 提供的 FE 能量 API（MC 26.x 系列需 5.x）
	implementation "teamreborn:energy:5.0.0"

	// JetBrains 注解
	implementation "org.jetbrains:annotations:24.1.0"

	if (hasCreate) {
		compileOnly createJars
		compileOnly portingJars
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}