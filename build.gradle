plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

repositories {
	// Loom 已自动添加获取 Minecraft 与基础库所需仓库（镜像见 settings.gradle），仅当需要其他第三方 MOD 构件时才在此添加。
}

// Create 兼容层（可选依赖）：libs/ 下提供 create-fabric jar 与预先合并的 porting-lib 单 jar 时才参与编译。
// MC 1.21.1 对应 Create Fabric 6.0.x 系列、porting-lib 4.x；libs/ 下文件名匹配 "create*" 与 "porting*"。
// 注：porting-lib 的官方发布包是 jar-in-jar bundle，loom 的 modCompileOnly 不会自动解包 META-INF/jars，
// 因此需先把 bundle 拆包合并成单 jar（合并脚本见项目根目录的 scripts/merge_porting_lib.sh）。
def createJars = fileTree(dir: 'libs', include: 'create*.jar')
def portingJars = fileTree(dir: 'libs', include: 'porting*.jar')
def hasCreate = !createJars.empty && !portingJars.empty

loom {
	splitEnvironmentSourceSets()

	mods {
		"autoresource" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

sourceSets {
	main {
		java {
			if (!hasCreate) {
				exclude 'cn/sd/jrz/autoresource/compat/create/CreateRegistration.java'
				exclude 'cn/sd/jrz/autoresource/compat/create/WaterWheelMotorBlock.java'
				exclude 'cn/sd/jrz/autoresource/compat/create/WaterWheelMotorEntity.java'
				exclude 'cn/sd/jrz/autoresource/compat/create/WaterWheelMotorItem.java'
				exclude 'cn/sd/jrz/autoresource/compat/create/WaterWheelMotorMenu.java'
			}
		}
	}
	client {
		java {
			if (!hasCreate) {
				exclude 'cn/sd/jrz/autoresource/client/compat/create/**'
			}
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// TechReborn 提供的 FE 能量 API
	// MC 1.21.1 fabric-api 已内置 net.fabricmc.fabric.api.transfer.v1.energy.EnergyStorage
	// 但为兼容下游 FE 接收方惯例，此处仍保留 teamreborn 入口
	modImplementation "teamreborn:energy:3.0.0"

	// JetBrains 注解
	modImplementation "org.jetbrains:annotations:24.1.0"

	if (hasCreate) {
		modCompileOnly createJars
		modCompileOnly portingJars
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}