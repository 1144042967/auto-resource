plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

repositories {
	// Loom 已自动添加获取 Minecraft 与基础库所需仓库（镜像见 settings.gradle），仅当需要其他第三方 MOD 构件时才在此添加。
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"autoresource" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// TechReborn 提供的 FE 能量 API
	// 版本对应关系：3.0.0=MC 1.20.x、4.1.0=MC 1.21.x（4.0.0 起改用 ResourceLocation.parse，
	// 旧的 3.0.0 在 1.21.1 上会因 new ResourceLocation(String) 已移除而 NoSuchMethodError 崩溃）
	// MC 1.21.1 fabric-api 已内置 net.fabricmc.fabric.api.transfer.v1.energy.EnergyStorage
	// 但为兼容下游 FE 接收方惯例，此处仍保留 teamreborn 入口
	modImplementation "teamreborn:energy:4.1.0"

	// JetBrains 注解
	modImplementation "org.jetbrains:annotations:24.1.0"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}