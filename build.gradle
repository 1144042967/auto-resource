plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

repositories {
	// Loom 已自动添加获取 Minecraft 与基础库所需仓库（镜像见 settings.gradle），仅当需要其他第三方 MOD 构件时才在此添加。
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"autoresource" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// Create 兼容层（可选依赖）：libs/ 下提供 create-fly jar（1.21.11 机械动力飞越版，由第三方MOD/Create-Fly 项目
// 用 gradle 9.5.1 构建产出）时才参与编译。未提供时排除需要 Create API 的兼容类（CreateCompat 不引用 Create 类型，保留编译）。
def createJars = fileTree(dir: 'libs', include: 'create*.jar')
def hasCreate = !createJars.empty

sourceSets {
	main {
		java {
			if (!hasCreate) {
				exclude 'cn/sd/jrz/autoresource/compat/create/CreateRegistration.java'
				exclude 'cn/sd/jrz/autoresource/compat/create/WaterWheelMotorBlock.java'
				exclude 'cn/sd/jrz/autoresource/compat/create/WaterWheelMotorEntity.java'
				exclude 'cn/sd/jrz/autoresource/compat/create/WaterWheelMotorItem.java'
				exclude 'cn/sd/jrz/autoresource/compat/create/WaterWheelMotorMenu.java'
			}
		}
	}
	client {
		java {
			if (!hasCreate) {
				exclude 'cn/sd/jrz/autoresource/client/compat/create/**'
			}
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// TechReborn 提供的 FE 能量 API
	// 版本对应关系：3.0.0=MC 1.20.x、4.1.0=MC 1.21.x、4.2.0=MC 1.21.5+（含 1.21.11）
	// 4.1.0 虽声明 >=1.21- 可加载，但 4.2.0 是官方针对 1.21.5+ 构建的版本，故 1.21.11 用 4.2.0
	// MC 1.21.x fabric-api 已内置 net.fabricmc.fabric.api.transfer.v1.energy.EnergyStorage
	// 但为兼容下游 FE 接收方惯例，此处仍保留 teamreborn 入口
	modImplementation "teamreborn:energy:4.2.0"

	// JetBrains 注解
	modImplementation "org.jetbrains:annotations:24.1.0"

	// Create 机械动力飞越版（可选）：libs/ 下有 create*.jar 才参与编译，发布版按可选依赖（运行时缺 create 时不加载）
	if (hasCreate) {
		// create-fly 用 unobfuscated（mojmap）命名构建，与项目 officialMojangMappings 一致，无需 loom 重映射；
		// 用 compileOnly（而非 modCompileOnly）避免 remap 失败
		compileOnly createJars
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}